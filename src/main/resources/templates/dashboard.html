<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Layout</title>
    <link th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}" rel="stylesheet">
    <script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}" defer></script>
    <script th:src="@{/webjars/flatpickr/4.6.13/dist/flatpickr.min.js}" defer></script>
    <script th:src="@{/js/app.js}" defer></script>
    
    <style>
        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

     


        .navbar {
            z-index: 1000;
            width: 100%;
            position: fixed !important ;
            top: 0;
            left: 0;
            background-color: white;
            color: black;
            border-bottom-right-radius: 10px;
        }

        .sidebar {
            width: 250px;
            height: 100%;
            background-color: #a085ff;
            position: fixed;
            top: 56px; /* Height of the navbar */
            left: 0;
            bottom: 0;
            padding-top: 10px;
        }

        .sidebar a {
            color: white;
            text-decoration: none;
            padding: 10px 15px;
            display: flex;
            align-items: center;
        }

        .sidebar a:hover {
            background-color: #7a59f1;
            color: white;
        }

        .sidebar i {
            margin-right: 10px;
        }

        .main-content {
            margin-left: 250px;
            padding: 20px;
            flex-grow: 1;
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"> <i class="bi bi-book"></i>📖 Bibliothèque</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link text-white" href="#">
                            <i class="fas fa-ellipsis-h"></i>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Sidebar -->
    <div class="sidebar d-flex flex-column">
        <h2 class="text-white text-center">Menu</h2>
        <a href="/books">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="#FFFFFF" stroke-width="2" style="margin-right: 8px;">
                <path d="M3 12l2-2 4 4 8-8 2 2" />
                <path d="M2 9l6 6 8-8" />
                <path d="M2 12v6a2 2 0 002 2h14a2 2 0 002-2v-6" />
            </svg>
            Accueil
        </a>
        <a href="/members">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="#FFFFFF" stroke-width="2" style="margin-right: 8px;">
                <circle cx="9" cy="7" r="4" />
                <circle cx="15" cy="7" r="4" />
                <path d="M9 11c-4.418 0-8 1.79-8 4v4h16v-4c0-2.21-3.582-4-8-4zM15 11c4.418 0 8 1.79 8 4v4h-16v-4c0-2.21 3.582-4 8-4z" />
            </svg>
            Liste des membres
        </a>
        <a href="/books/listSearch">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="#FFFFFF" stroke-width="2" style="margin-right: 8px;">
                <path d="M3 18V5a2 2 0 012-2h7v16H5a2 2 0 01-2-2z" />
                <path d="M21 18V5a2 2 0 00-2-2h-7v16h7a2 2 0 002-2z" />
            </svg>
            
            Liste des livres
        </a>
        <a href="/bookMembers">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="#FFFFFF" stroke-width="2" style="margin-right: 8px;">
                <circle cx="12" cy="12" r="10" />
                <path d="M10 16l4-4-4-4" />
            </svg>
            Voir permission
        </a>
    </div>
    

    <!-- Main Content -->
    <div class="main-content">
        <div style="height: 50px;"></div>

        <!-- Main content area is empty -->
        <div layout:fragment="content" />
    </div>

    <script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
</body>

</html>
